[project]
name = "aviation-weather-briefing-bot"
version = "0.1.0"
description = "Free aviation weather briefing bot using public US govt METAR/TAF API"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
]
[project.optional-dependencies]
checkwx = ["httpx"]
avwx = ["httpx"]

[project.scripts]
weather-bot = "weather_bot.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
